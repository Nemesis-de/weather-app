<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Погода</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="box">
    <h1>Кукареку</h1>

    <div class="form-row">
      <input type="text" id="city-input" placeholder="Например, Amsterdam">
      <button id="search-btn">Найти</button>
    </div>

    <p id="status"></p>

    <div id="result" class="result hidden">
      <h2 id="city-name"></h2>
      <p id="temperature" class="temp"></p>
      <p id="wind"></p>
      <p id="coords"></p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
